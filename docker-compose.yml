services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - public_files:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "90:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_files:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - portfolio_network

  db:
    image: mysql:8.0
    container_name: portfolio_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portfolio_network

  # Uncomment to run queue workers
  # queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: portfolio_queue
  #   restart: unless-stopped
  #   env_file: .env
  #   command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
  #   volumes:
  #     - app_storage:/var/www/html/storage
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   networks:
  #     - portfolio_network

networks:
  portfolio_network:
    driver: bridge

volumes:
  app_storage:
  public_files:
  db_data:
